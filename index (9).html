<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory Kids</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', sans-serif;
    background: #FFF7ED;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .topbar {
    background: #F97316;
    color: white;
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 12px rgba(249,115,22,0.3);
    z-index: 100;
  }

  .container {
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  .icon {
    font-size: 6rem;
    margin-bottom: 20px;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .card {
    background: #FEE2E2;
    border-radius: 24px;
    padding: 40px 32px;
    box-shadow: 0 8px 40px rgba(220,38,38,0.15);
    border: 3px solid #FCA5A5;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    color: #DC2626;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  p {
    color: #78716C;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.5;
  }

  .divider {
    width: 60px;
    height: 4px;
    background: #FCA5A5;
    border-radius: 4px;
    margin: 20px auto;
  }

  .sub {
    font-size: 0.85rem;
    color: #DC2626;
    font-weight: 800;
    margin-top: 16px;
    background: rgba(220,38,38,0.1);
    border-radius: 12px;
    padding: 10px 16px;
    display: inline-block;
  }
</style>
</head>
<body>

<div class="topbar">⛪ Victory Kids</div>

<div class="container">
  <div class="icon">🚫</div>
  <div class="card">
    <h1>Cupos Completos</h1>
    <div class="divider"></div>
    <p>No hay lugares disponibles en ninguna sala por el momento.</p>
    <div class="sub">📋 Consultá con un encargado</div>
  </div>
</div>

</body>
</html>
